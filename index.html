<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurado Podcast - 50 Podcasts Actualizados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .podcast-card.evaluated { border-left: 6px solid #10b981; }
        .podcast-card.starred { background-color: #fffbeb; border: 1px solid #fcd34d; }
        .rubric-grid label { cursor: pointer; transition: all 0.2s; }
        .rubric-grid input:checked + div { background-color: #1e293b; color: white; border-color: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-800">

    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Jurado VI Concurso Podcast</h1>
                <p class="text-slate-500 font-medium text-sm">50 Audios • Rúbrica RNE • Cálculo Automático</p>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="exportJSON()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700">Respaldar (JSON)</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-amber-600">Importar Socio</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
                <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">Exportar Acta (CSV)</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="search" placeholder="Buscar título..." class="p-3 rounded-xl border border-slate-200 shadow-sm outline-none focus:ring-2 focus:ring-blue-500" oninput="renderList()">
            <select id="filterCat" class="p-3 rounded-xl border border-slate-200 shadow-sm outline-none" onchange="renderList()">
                <option value="all">Todas las Categorías</option>
                <option value="1">Cat 1 (1º-3º Prim)</option>
                <option value="2">Cat 2 (4º-6º Prim)</option>
                <option value="3">Cat 3 (1º-3º ESO)</option>
                <option value="4">Cat 4 (4º ESO-Bach-FP)</option>
                <option value="Sin asignar">Sin asignar</option>
            </select>
            <div class="flex items-center justify-center bg-white rounded-xl border border-slate-200 shadow-sm p-2">
                <label class="flex items-center cursor-pointer font-bold text-amber-600">
                    <input type="checkbox" id="filterStarred" class="mr-2 w-5 h-5 accent-amber-500" onchange="renderList()"> Solo Destacados ⭐
                </label>
            </div>
        </div>

        <div id="podcastList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="modal" class="fixed inset-0 bg-slate-900/80 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[95vh] overflow-y-auto p-6 md:p-8 shadow-2xl relative">
            <button onclick="closeModal()" class="fixed md:absolute top-4 right-4 bg-white rounded-full w-10 h-10 shadow-lg text-slate-400 hover:text-slate-600 text-3xl z-10">&times;</button>
            
            <div class="mb-4">
                <h2 id="mTitle" class="text-2xl font-bold mb-1 pr-10"></h2>
                <p id="mSub" class="text-slate-500 font-bold uppercase text-[10px] tracking-widest"></p>
            </div>
            
            <a id="mLink" target="_blank" class="flex items-center bg-blue-600 text-white px-6 py-4 rounded-xl font-black mb-8 hover:bg-blue-700 transition w-full justify-center shadow-md text-center">
                REPRODUCIR AUDIO (MÁX 5 MIN) 🎧
            </a>

            <div id="rubricForm" class="space-y-6">
                <section>
                    <h3 class="font-black text-slate-800 border-b border-slate-100 mb-3 pb-1 uppercase text-[11px] tracking-wider">1. Guion y Contenido</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 rubric-grid">
                        <label><input type="radio" name="d1" value="4" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] peer-checked:border-blue-500 font-medium italic">4. Exc: Cuidado, creativo, con sentido.</div></label>
                        <label><input type="radio" name="d1" value="3" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] peer-checked:border-blue-500 font-medium italic">3. Sat: Trabajado, historia integrada.</div></label>
                        <label><input type="radio" name="d1" value="2" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] peer-checked:border-blue-500 font-medium italic">2. Mej: Poco original, falta sentido.</div></label>
                        <label><input type="radio" name="d1" value="1" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] peer-checked:border-blue-500 font-medium italic">1. Ins: Desordenado, sin narración.</div></label>
                    </div>
                </section>

                <section>
                    <h3 class="font-black text-slate-800 border-b border-slate-100 mb-3 pb-1 uppercase text-[11px] tracking-wider">2. Calidad Audio (Grabación)</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 rubric-grid">
                        <label><input type="radio" name="d2" value="4" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">4. Exc: Sonido nítido, gran dicción.</div></label>
                        <label><input type="radio" name="d2" value="3" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">3. Sat: Buena calidad y tono correcto.</div></label>
                        <label><input type="radio" name="d2" value="2" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">2. Mej: Grabación mejorable, ruido.</div></label>
                        <label><input type="radio" name="d2" value="1" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">1. Ins: Poca calidad, ininteligible.</div></label>
                    </div>
                </section>

                <section>
                    <h3 class="font-black text-slate-800 border-b border-slate-100 mb-3 pb-1 uppercase text-[11px] tracking-wider">3. Calidad Montaje</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 rubric-grid">
                        <label><input type="radio" name="d3" value="4" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">4. Exc: Coherencia y creatividad total.</div></label>
                        <label><input type="radio" name="d3" value="3" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">3. Sat: Ensamblado con buen manejo.</div></label>
                        <label><input type="radio" name="d3" value="2" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">2. Mej: Falta cohesión en elementos.</div></label>
                        <label><input type="radio" name="d3" value="1" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">1. Ins: Unión de audio sin sentido.</div></label>
                    </div>
                </section>

                <section>
                    <h3 class="font-black text-slate-800 border-b border-slate-100 mb-3 pb-1 uppercase text-[11px] tracking-wider">4. Trabajo Grupal</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 rubric-grid">
                        <label><input type="radio" name="d4" value="4" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">4. Exc: Muchas voces, gran equipo.</div></label>
                        <label><input type="radio" name="d4" value="3" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">3. Sat: Se percibe colaboración.</div></label>
                        <label><input type="radio" name="d4" value="2" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">2. Mej: Participación desigual.</div></label>
                        <label><input type="radio" name="d4" value="1" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">1. Ins: Una sola voz o sin equipo.</div></label>
                    </div>
                </section>

                <section>
                    <h3 class="font-black text-slate-800 border-b border-slate-100 mb-3 pb-1 uppercase text-[11px] tracking-wider">5. Contenido Extra</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 rubric-grid">
                        <label><input type="radio" name="d5" value="4" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">4. Exc: Guion, fotos, vídeos y logo.</div></label>
                        <label><input type="radio" name="d5" value="3" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">3. Sat: Varios extras y buen logo.</div></label>
                        <label><input type="radio" name="d5" value="2" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">2. Mej: Algún extra, logo básico.</div></label>
                        <label><input type="radio" name="d5" value="1" class="sr-only peer"><div class="p-2 border-2 rounded-lg h-full text-[9px] font-medium italic">1. Ins: Sin material extra ni logo.</div></label>
                    </div>
                </section>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase">Centro y Categoría</label>
                        <div class="flex gap-2">
                            <input type="text" id="mCenter" placeholder="Centro Educativo" class="flex-1 bg-slate-50 p-2 rounded border text-xs outline-none">
                            <select id="mCat" class="bg-slate-50 p-2 rounded border text-xs outline-none">
                                <option value="Sin asignar">Cat?</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                            </select>
                        </div>
                    </div>
                    <label class="flex items-center gap-3 bg-amber-50 p-3 rounded-xl border border-amber-200 cursor-pointer">
                        <input type="checkbox" id="mStar" class="w-5 h-5 accent-amber-500">
                        <span class="font-black text-amber-900 text-xs italic uppercase">Favorito / Destacado ⭐</span>
                    </label>
                </div>

                <textarea id="mNotes" class="w-full border rounded-xl p-3 h-16 bg-slate-50 text-xs outline-none focus:ring-1 focus:ring-blue-400" placeholder="Observaciones adicionales..."></textarea>

                <div class="bg-slate-900 p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="text-white">
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Media Final (Rúbrica)</p>
                        <p id="liveScore" class="text-3xl font-black">--</p>
                    </div>
                    <button onclick="save()" class="bg-green-500 text-white px-8 py-3 rounded-xl font-black text-md hover:bg-green-600 transition w-full md:w-auto">GUARDAR EVALUACIÓN</button>
                </div>
            </div>
        </div>
    </div>
