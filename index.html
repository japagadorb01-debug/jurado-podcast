<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurado Podcast - Modo Equipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .podcast-card.evaluated { border-left: 6px solid #10b981; }
        .podcast-card.starred { background-color: #fffbeb; border: 1px solid #fcd34d; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">Evaluación VI Concurso</h1>
                <p class="text-slate-500">Panel Colaborativo para Jurado</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportJSON()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700">Exportar (Para socio)</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-amber-600">Importar (De socio)</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
                <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">Finalizar (CSV)</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="search" placeholder="Buscar por título o centro..." class="p-3 rounded-xl border border-slate-200 shadow-sm" oninput="renderList()">
            <select id="filterCat" class="p-3 rounded-xl border border-slate-200 shadow-sm" onchange="renderList()">
                <option value="all">Todas las Categorías</option>
                <option value="1">Categoría 1</option>
                <option value="2">Categoría 2</option>
                <option value="3">Categoría 3</option>
                <option value="4">Categoría 4</option>
                <option value="Sin asignar">Sin asignar</option>
            </select>
            <div class="flex items-center justify-center bg-white rounded-xl border border-slate-200 shadow-sm">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="filterStarred" class="mr-2" onchange="renderList()"> Solo destacados ⭐
                </label>
            </div>
        </div>

        <div id="podcastList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 shadow-2xl">
            <div class="flex justify-between items-start mb-4">
                <h2 id="mTitle" class="text-2xl font-bold text-slate-800"></h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-3xl">&times;</button>
            </div>
            
            <a id="mLink" target="_blank" class="inline-flex items-center bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-semibold mb-6 hover:bg-blue-100 transition">
                <span>Reproducir Podcast</span>
                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </a>

            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Centro Educativo</label>
                        <input type="text" id="mCenter" class="w-full border-b-2 py-1 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase">Categoría</label>
                        <select id="mCat" class="w-full border-b-2 py-1 outline-none">
                            <option value="Sin asignar">Sin asignar</option>
                            <option value="1">1 (1º-3º Prim)</option>
                            <option value="2">2 (4º-6º Prim)</option>
                            <option value="3">3 (1º-3º ESO)</option>
                            <option value="4">4 (4º ESO-Bach-FP)</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-xl">
                    <p class="font-bold text-slate-700 mb-4 text-center">PUNTUACIÓN GLOBAL DEL JURADO</p>
                    <div class="flex justify-around items-center">
                        <label class="text-center group cursor-pointer">
                            <input type="radio" name="score" value="0" class="sr-only peer">
                            <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 text-slate-400 font-bold transition">0</div>
                            <span class="text-[10px] mt-1 block">NULO</span>
                        </label>
                        <label class="text-center group cursor-pointer">
                            <input type="radio" name="score" value="1" class="sr-only peer">
                            <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 text-slate-400 font-bold transition">1</div>
                            <span class="text-[10px] mt-1 block">INSUF.</span>
                        </label>
                        <label class="text-center group cursor-pointer">
                            <input type="radio" name="score" value="2" class="sr-only peer">
                            <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center peer-checked:bg-amber-400 peer-checked:text-white peer-checked:border-amber-400 text-slate-400 font-bold transition">2</div>
                            <span class="text-[10px] mt-1 block">BIEN</span>
                        </label>
                        <label class="text-center group cursor-pointer">
                            <input type="radio" name="score" value="3" class="sr-only peer">
                            <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 text-slate-400 font-bold transition">3</div>
                            <span class="text-[10px] mt-1 block">NOTABLE</span>
                        </label>
                        <label class="text-center group cursor-pointer">
                            <input type="radio" name="score" value="4" class="sr-only peer">
                            <div class="w-12 h-12 rounded-full border-2 flex items-center justify-center peer-checked:bg-green-600 peer-checked:text-white peer-checked:border-green-600 text-slate-400 font-bold transition">4</div>
                            <span class="text-[10px] mt-1 block">EXCEL.</span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center gap-4 bg-amber-50 p-4 rounded-xl border border-amber-100">
                    <input type="checkbox" id="mStar" class="w-6 h-6 accent-amber-500">
                    <label for="mStar" class="font-bold text-amber-800">Candidato a Ganador / Destacado ⭐</label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Observaciones y notas críticas</label>
                    <textarea id="mNotes" class="w-full border rounded-xl p-3 h-32 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="¿Por qué esta nota?"></textarea>
                </div>

                <button onclick="save()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-900 transition active:scale-95">Guardar Evaluación</button>
            </div>
        </div>
    </div>

    <script>
        // Datos base (puedes ampliar la lista aquí)
        let podcasts = [
            { id: 1, title: "Noticias de Actualidad", center: "IES Villa de Valdemoro", category: "4", link: "https://elocuencias.com/podcast/noticias-de-actualidad_1o-b-bto_ies-villa-de-valdemoro/", evaluated: false, score: null, starred: false, notes: "" },
            { id: 2, title: "Sexto Sentido", center: "IES Villa de Valdemoro", category: "4", link: "https://elocuencias.com/podcast/sexto-sentido-1o-e-bto-ies-villa-de-valdemoro/", evaluated: false, score: null, starred: false, notes: "" }
            // Añade los 48 restantes aquí...
        ];

        // Al iniciar: Intentar cargar de memoria local
        const localData = localStorage.getItem('concurso_v1');
        if(localData) podcasts = JSON.parse(localData);

        function renderList() {
            const container = document.getElementById('podcastList');
            const search = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('filterCat').value;
            const onlyStar = document.getElementById('filterStarred').checked;

            container.innerHTML = '';

            podcasts.forEach(p => {
                const matchesSearch = p.title.toLowerCase().includes(search) || p.center.toLowerCase().includes(search);
                const matchesCat = cat === 'all' || p.category === cat;
                const matchesStar = !onlyStar || p.starred;

                if(matchesSearch && matchesCat && matchesStar) {
                    const card = document.createElement('div');
                    card.className = `podcast-card bg-white p-5 rounded-2xl shadow-sm cursor-pointer hover:shadow-md transition ${p.evaluated ? 'evaluated' : ''} ${p.starred ? 'starred' : ''}`;
                    card.onclick = () => openModal(p.id);
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="max-w-[70%]">
                                <h3 class="font-bold text-slate-800 truncate">${p.starred ? '⭐ ' : ''}${p.title}</h3>
                                <p class="text-xs text-slate-400 mt-1">${p.center}</p>
                                <span class="inline-block mt-2 text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 uppercase font-bold text-center">Cat: ${p.category}</span>
                            </div>
                            <div class="text-right">
                                ${p.evaluated ? `<span class="text-2xl font-black text-slate-700">${p.score}</span><p class="text-[9px] font-bold text-slate-400 uppercase">Puntos</p>` : `<span class="text-xs text-slate-300 italic">Pendiente</span>`}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        let currentEditingId = null;
        function openModal(id) {
            currentEditingId = id;
            const p = podcasts.find(x => x.id === id);
            document.getElementById('mTitle').innerText = p.title;
            document.getElementById('mLink').href = p.link;
            document.getElementById('mCenter').value = p.center;
            document.getElementById('mCat').value = p.category;
            document.getElementById('mStar').checked = p.starred;
            document.getElementById('mNotes').value = p.notes;
            
            document.getElementsByName('score').forEach(r => {
                r.checked = (r.value == p.score);
            });

            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function save() {
            const p = podcasts.find(x => x.id === currentEditingId);
            p.center = document.getElementById('mCenter').value;
            p.category = document.getElementById('mCat').value;
            p.starred = document.getElementById('mStar').checked;
            p.notes = document.getElementById('mNotes').value;
            p.score = document.querySelector('input[name="score"]:checked')?.value;
            p.evaluated = true;

            localStorage.setItem('concurso_v1', JSON.stringify(podcasts));
            renderList();
            closeModal();
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(podcasts)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `evaluacion_equipo_${new Date().getTime()}.json`;
            a.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const importedData = JSON.parse(e.target.result);
                // Fusión inteligente: Solo sobrescribe si el importado tiene evaluación y el actual no, o si el importado es más reciente
                podcasts = importedData; 
                localStorage.setItem('concurso_v1', JSON.stringify(podcasts));
                renderList();
                alert("¡Datos sincronizados con éxito!");
            };
            reader.readAsText(file);
        }

        function exportCSV() {
            let csv = "ID;Titulo;Centro;Categoria;Puntos;Destacado;Notas\n";
            podcasts.forEach(p => {
                csv += `${p.id};"${p.title}";"${p.center}";${p.category};${p.score || 0};${p.starred ? 'SI':'NO'};"${p.notes}"\n`;
            });
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "ACTA_FINAL_JURADO.csv";
            a.click();
        }

        renderList();
    </script>
</body>
</html>
